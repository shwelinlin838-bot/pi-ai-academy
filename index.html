<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi AI Academy</title>
    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #5a2e82; }
        button { background-color: #8a2be2; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Pi AI Academy</h1>
        <p>Learn AI Skills inside the Pi Ecosystem for Free!</p>
        <div id="user-info">
            <button onclick="authPi()">Sign in with Pi</button>
        </div>
    </div>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        function authPi() {
            const scopes = ['username'];
            function onIncompletePaymentFound(payment) { };

            Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
                document.getElementById('user-info').innerHTML = `<h3>Hello, ${auth.user.username}! 👋</h3><p>Welcome to AI Academy.</p>`;
            }).catch(function(error) {
                console.error(error);
            });
        }
    </script>
</body>
</html>
